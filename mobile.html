<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expense Tracker Mobile</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script> <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: { brand: { 50: '#eff6ff', 500: '#3b82f6', 600: '#2563eb' } }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animasi Bottom Sheet */
        .bottom-sheet { transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .bottom-sheet.active { transform: translateY(0); }
        .overlay { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .overlay.active { opacity: 1; pointer-events: auto; }

        /* --- STYLING UNTUK ELEMEN YANG DIBUAT OLEH SCRIPT.JS ANDA --- */
        
        /* Riwayat Pengeluaran */
        .expense-wrapper { background: white; border-radius: 1rem; padding: 1rem; margin-bottom: 0.75rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #f1f5f9; }
        .expense-item { display: flex; justify-content: space-between; align-items: center; }
        .expense-info { flex: 1; }
        .expense-title { font-weight: 700; color: #1e293b; font-size: 0.95rem; }
        .expense-category { font-size: 0.7rem; color: #3b82f6; background: #eff6ff; padding: 2px 8px; border-radius: 99px; display: inline-block; margin-top: 4px; font-weight: 600; }
        .expense-date { font-size: 0.75rem; color: #94a3b8; margin-top: 4px; font-weight: 500; }
        .expense-amount { font-weight: 800; color: #ef4444; white-space: nowrap; margin: 0 10px; font-size: 0.95rem; }
        .expense-actions { display: flex; flex-direction: column; gap: 6px; }
        .btn-edit, .btn-delete { font-size: 0.7rem; padding: 4px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-edit { background: #f1f5f9; color: #475569; } .btn-edit:hover { background: #e2e8f0; }
        .btn-delete { background: #fef2f2; color: #ef4444; } .btn-delete:hover { background: #fee2e2; }
        
        /* Edit Pop-up Inline */
        .edit-box { margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed #e2e8f0; }
        .edit-box h3 { font-size: 0.85rem; font-weight: 700; margin-bottom: 10px; color: #334155; }
        .form-group { margin-bottom: 0.75rem; }
        .form-group label { display: block; font-size: 0.75rem; color: #64748b; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 0.85rem; outline: none; }
        .edit-actions { display: flex; gap: 8px; margin-top: 1rem; }
        .btn-save { flex: 1; background: #3b82f6; color: white; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; }
        .btn-cancel { flex: 1; background: #f1f5f9; color: #475569; padding: 8px; border-radius: 8px; font-weight: 600; font-size: 0.8rem; }

        /* Category Breakdown Bar */
        .breakdown-item { margin-bottom: 1rem; }
        .breakdown-top { display: flex; justify-content: space-between; margin-bottom: 4px; align-items: flex-end; }
        .breakdown-meta { display: flex; align-items: center; gap: 8px; }
        .breakdown-name { font-size: 0.85rem; font-weight: 600; color: #334155; }
        .breakdown-percent { font-size: 0.75rem; color: #94a3b8; font-weight: 500; }
        .breakdown-amount { font-size: 0.85rem; font-weight: 700; color: #0f172a; }
        .breakdown-bar { width: 100%; height: 6px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
        .breakdown-fill { height: 100%; background: #3b82f6; border-radius: 99px; transition: width 0.5s ease; }
        
        .empty-text { text-align: center; color: #94a3b8; font-size: 0.85rem; padding: 2rem 0; font-style: italic; }
    </style>
</head>
<body class="text-slate-800">

    <span id="total" style="display: none;"></span>

    <div class="max-w-md mx-auto bg-gray-50 min-h-screen relative pb-24 overflow-x-hidden shadow-2xl">
        
        <header class="bg-white px-6 pt-10 pb-4 sticky top-0 z-10 shadow-sm">
            <div class="flex justify-between items-center">
                <div>
                    <p class="text-sm text-slate-500 font-medium mb-1">Halo, Selamat datang!</p>
                    <h1 class="text-xl font-bold text-slate-800">Keuanganku</h1>
                </div>
                <div class="w-10 h-10 rounded-full bg-brand-100 text-brand-600 flex items-center justify-center text-lg font-bold border-2 border-brand-500">
                    <i class="fas fa-wallet"></i>
                </div>
            </div>
        </header>

        <main id="tab-dashboard" class="px-6 py-6 space-y-6 tab-content">
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                <label for="month-picker" class="text-sm font-semibold text-slate-600">Pilih Bulan:</label>
                <input type="month" id="month-picker" class="bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-lg px-3 py-2 outline-none focus:border-brand-500">
            </div>

            <div class="bg-gradient-to-br from-brand-600 to-brand-800 rounded-3xl p-6 text-white shadow-lg shadow-brand-500/30 relative overflow-hidden">
                <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white/10 blur-2xl"></div>
                
                <div class="relative z-10">
                    <p class="text-brand-100 text-sm font-medium mb-1">Total Pengeluaran (<span id="dashboard-period">-</span>)</p>
                    <h2 class="text-3xl font-extrabold tracking-tight mb-6" id="dashboard-total">IDR 0</h2>
                    
                    <div class="flex items-center justify-between text-sm">
                        <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-2xl flex items-center gap-2">
                            <i class="fas fa-receipt text-brand-100"></i>
                            <span class="font-medium"><span id="dashboard-count">0</span> Transaksi</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-blue-50 border border-blue-100 p-4 rounded-2xl flex gap-3 items-start text-sm text-blue-800">
                <i class="fas fa-lightbulb text-blue-500 mt-1"></i>
                <p id="insight-box" class="font-medium leading-relaxed">Menganalisa data pengeluaran Anda...</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs text-slate-500 font-medium mb-1">Kategori Terbesar</p>
                    <p class="font-bold text-slate-800 text-sm truncate" id="dashboard-top-category">-</p>
                    <p class="text-xs text-red-500 font-bold mt-1" id="dashboard-top-category-amount">-</p>
                </div>
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                    <p class="text-xs text-slate-500 font-medium mb-1">Pengeluaran Tertinggi</p>
                    <p class="font-bold text-slate-800 text-sm truncate" id="dashboard-highest-expense">-</p>
                    <p class="text-xs text-red-500 font-bold mt-1" id="dashboard-highest-expense-amount">-</p>
                </div>
            </div>

            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 card">
                <h3 class="text-base font-bold text-slate-800 mb-4">Grafik Kategori</h3>
                <div class="relative w-full aspect-square">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>

            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 card">
                <h3 class="text-base font-bold text-slate-800 mb-4">Tren Harian</h3>
                <canvas id="dailyChart" class="w-full"></canvas>
            </div>

            <div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100">
                <h3 class="text-base font-bold text-slate-800 mb-4">Rincian Kategori</h3>
                <div id="category-breakdown-list">
                    </div>
            </div>
        </main>

        <main id="tab-history" class="px-6 py-6 hidden tab-content min-h-[70vh]">
            <h2 class="text-xl font-bold text-slate-800 mb-4">Semua Riwayat</h2>
            
            <div class="flex gap-2 mb-6">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search" placeholder="Cari nama pengeluaran..." class="w-full bg-white border border-slate-200 text-sm rounded-2xl pl-10 pr-4 py-3 outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all shadow-sm">
                </div>
                <div class="relative w-1/3">
                    <select id="filter-category" class="w-full bg-white border border-slate-200 text-sm rounded-2xl px-4 py-3 outline-none focus:border-brand-500 shadow-sm appearance-none font-medium text-slate-700">
                        <option value="Semua">Semua</option>
                        <option value="Makanan">Makanan</option>
                        <option value="Transport">Transport</option>
                        <option value="Belanja">Belanja</option>
                        <option value="Tagihan">Tagihan</option>
                        <option value="Hiburan">Hiburan</option>
                        <option value="Kesehatan">Kesehatan</option>
                        <option value="Pendidikan">Pendidikan</option>
                        <option value="Lainnya">Lainnya</option>
                    </select>
                </div>
            </div>

            <div id="expense-list">
                </div>
        </main>

        <main id="tab-settings" class="px-6 py-6 hidden tab-content min-h-[70vh]">
            <h2 class="text-xl font-bold text-slate-800 mb-6">Pengaturan Data</h2>
            
            <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-4 border-b border-slate-50">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Backup & Restore</p>
                    
                    <button onclick="exportJSON()" class="w-full flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 rounded-xl mb-3 transition-colors text-left">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-blue-100 text-blue-600 flex items-center justify-center"><i class="fas fa-file-code"></i></div>
                            <div>
                                <p class="text-sm font-bold text-slate-800">Export JSON</p>
                                <p class="text-xs text-slate-500">Backup data format aplikasi</p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-slate-300"></i>
                    </button>

                    <button onclick="exportCSV()" class="w-full flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 rounded-xl mb-3 transition-colors text-left">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-green-100 text-green-600 flex items-center justify-center"><i class="fas fa-file-excel"></i></div>
                            <div>
                                <p class="text-sm font-bold text-slate-800">Export CSV</p>
                                <p class="text-xs text-slate-500">Buka di Excel / Spreadsheet</p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-slate-300"></i>
                    </button>

                    <input type="file" id="import-file" onchange="importData(event)" accept=".json,.csv" class="hidden">
                    <button onclick="document.getElementById('import-file').click()" class="w-full flex items-center justify-between p-3 bg-slate-50 hover:bg-slate-100 rounded-xl transition-colors text-left">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-lg bg-purple-100 text-purple-600 flex items-center justify-center"><i class="fas fa-file-import"></i></div>
                            <div>
                                <p class="text-sm font-bold text-slate-800">Import Data</p>
                                <p class="text-xs text-slate-500">Kembalikan data dari file</p>
                            </div>
                        </div>
                        <i class="fas fa-chevron-right text-slate-300"></i>
                    </button>
                </div>
            </div>
        </main>

        <nav class="fixed bottom-0 w-full max-w-md bg-white border-t border-slate-100 pb-safe z-40 rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.03)]">
            <div class="flex justify-around items-center px-2 py-2 h-20 relative">
                
                <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn flex-1 flex flex-col items-center justify-center gap-1 text-brand-600 transition-colors">
                    <i class="fas fa-home text-xl mb-0.5"></i>
                    <span class="text-[10px] font-bold">Utama</span>
                </button>

                <div class="relative -top-6 flex justify-center w-20">
                    <button onclick="toggleModal('addModal')" class="w-14 h-14 bg-brand-500 text-white rounded-full flex items-center justify-center text-2xl shadow-lg shadow-brand-500/40 hover:bg-brand-600 active:scale-95 transition-all">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>

                <button onclick="switchTab('history')" id="nav-history" class="nav-btn flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fas fa-list text-xl mb-0.5"></i>
                    <span class="text-[10px] font-bold">Riwayat</span>
                </button>

                <button onclick="switchTab('settings')" id="nav-settings" class="nav-btn flex-1 flex flex-col items-center justify-center gap-1 text-slate-400 hover:text-slate-600 transition-colors">
                    <i class="fas fa-cog text-xl mb-0.5"></i>
                    <span class="text-[10px] font-bold">Seting</span>
                </button>

            </div>
        </nav>

        <div id="overlay" onclick="toggleModal('addModal')" class="overlay fixed inset-0 bg-slate-900/40 z-40 max-w-md mx-auto backdrop-blur-sm"></div>
        
        <div id="addModal" class="bottom-sheet fixed bottom-0 w-full max-w-md bg-white rounded-t-3xl z-50 shadow-2xl flex flex-col max-h-[90vh]">
            <div class="w-full flex justify-center pt-3 pb-2">
                <div class="w-12 h-1.5 bg-slate-200 rounded-full"></div>
            </div>

            <div class="px-6 pb-4 flex justify-between items-center border-b border-slate-100">
                <h3 class="font-bold text-lg text-slate-800">Catat Pengeluaran</h3>
                <button onclick="toggleModal('addModal')" class="w-8 h-8 bg-slate-100 text-slate-500 rounded-full flex items-center justify-center active:bg-slate-200">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <div class="px-6 py-4 overflow-y-auto hide-scrollbar">
                <form id="expense-form" class="space-y-4">
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Nama Pengeluaran</label>
                        <input type="text" id="title" placeholder="Cth: Makan Siang" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-brand-500 focus:bg-white transition-all">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Nominal (Rp)</label>
                            <input type="number" id="amount" placeholder="0" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-brand-500 focus:bg-white transition-all font-bold text-brand-600">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Tanggal</label>
                            <input type="date" id="date" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-brand-500 focus:bg-white transition-all text-slate-600">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 mb-1.5 uppercase tracking-wide">Kategori</label>
                        <div class="relative">
                            <select id="category" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm outline-none focus:border-brand-500 focus:bg-white transition-all appearance-none font-medium text-slate-700">
                                <option value="Makanan">🍔 Makanan</option>
                                <option value="Transport">🚗 Transport</option>
                                <option value="Belanja">🛍️ Belanja</option>
                                <option value="Tagihan">📄 Tagihan</option>
                                <option value="Hiburan">🎬 Hiburan</option>
                                <option value="Kesehatan">💊 Kesehatan</option>
                                <option value="Pendidikan">📚 Pendidikan</option>
                                <option value="Lainnya">✨ Lainnya</option>
                            </select>
                            <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
                        </div>
                    </div>

                    <p id="message" class="text-xs text-center text-brand-600 font-medium h-4"></p>

                    <button type="submit" class="w-full bg-brand-600 text-white font-bold rounded-xl py-4 mt-2 shadow-lg shadow-brand-500/30 active:scale-[0.98] transition-all flex justify-center items-center gap-2">
                        <i class="fas fa-save"></i> Simpan Data
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Logika Perpindahan Tab
        function switchTab(tabId) {
            // Sembunyikan semua konten tab
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.add('hidden');
            });
            // Tampilkan tab yang dipilih
            document.getElementById('tab-' + tabId).classList.remove('hidden');

            // Reset warna semua tombol navigasi
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-brand-600');
                btn.classList.add('text-slate-400');
            });
            // Beri warna aktif pada tombol yang dipilih
            const activeBtn = document.getElementById('nav-' + tabId);
            if(activeBtn){
                activeBtn.classList.remove('text-slate-400');
                activeBtn.classList.add('text-brand-600');
            }
        }

        // Logika Buka/Tutup Modal (Bottom Sheet)
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            const overlay = document.getElementById('overlay');
            
            if (modal.classList.contains('active')) {
                modal.classList.remove('active');
                overlay.classList.remove('active');
            } else {
                modal.classList.add('active');
                overlay.classList.add('active');
                // Set tanggal hari ini otomatis saat form dibuka
                if(modalID === 'addModal') {
                    document.getElementById('date').valueAsDate = new Date();
                }
            }
        }
    </script>

    <script src="script.js"></script>
</body>
</html>
